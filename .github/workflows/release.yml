name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Backend
        run: |
          cd backend
          go build -ldflags="-s -w" -o bin/dashboard.exe cmd/main.go

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Bump Version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd frontend
          node scripts/version-bump.mjs ${{ github.event.inputs.version_type }}
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          $VERSION = (Get-Content package.json | ConvertFrom-Json).version
          git add package.json CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD --tags

      - name: Build and Package Application
        run: |
          cd frontend
          npm run build:electron
          npm run build
          npm run electron:build

      - name: Get Release Info
        id: release_info
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dashboard ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            frontend/release/Dashboard-${{ steps.release_info.outputs.version }}-x64.exe
            frontend/release/Dashboard-${{ steps.release_info.outputs.version }}-x64.exe.blockmap
          generate_release_notes: true
          body: |
            ## Dashboard Release ${{ steps.release_info.outputs.tag }}
            
            ### Installation
            
            Download `Dashboard-${{ steps.release_info.outputs.version }}-x64.exe` and run the installer.
            
            ### Changes
            
            See release notes below for details.
